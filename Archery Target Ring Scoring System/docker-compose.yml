version: '3.8'

services:
  archery-system:
    build: .
    container_name: archery-scoring-system
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./models:/app/models
    environment:
      - FLASK_ENV=production
      - HOST=0.0.0.0
      - PORT=5000
    networks:
      - archery-network

networks:
  archery-network:
    driver: bridge
