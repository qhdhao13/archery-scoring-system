<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原服务器内容 - Lambert</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            font-weight: 300;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: #ffd700;
            text-decoration: none;
            font-size: 1.1rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .content-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .content-item:hover {
            transform: translateY(-5px);
        }
        .content-item h3 {
            margin-bottom: 15px;
            color: #ffd700;
        }
        .content-item p {
            margin-bottom: 20px;
            opacity: 0.9;
        }
        .content-item a {
            color: white;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 20px;
            transition: background 0.3s ease;
        }
        .content-item a:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← 返回首页</a>
        <h1>原服务器内容</h1>
        <p style="text-align: center; font-size: 1.2rem; opacity: 0.9;">
            这里保存了原服务器的所有内容，包括项目文件和文档
        </p>
        
        <div class="content-grid">
            <div class="content-item">
                <h3>射箭计分系统</h3>
                <p>基于图像识别的射箭靶环计分系统，支持自动识别和计分</p>
                <a href="/legacy/archery" target="_blank">查看项目</a>
            </div>
            
            <div class="content-item">
                <h3>巡检打卡小程序</h3>
                <p>微信小程序，用于巡检记录和打卡管理</p>
                <a href="/legacy/xunchan" target="_blank">查看项目</a>
            </div>
            
            <div class="content-item">
                <h3>项目文档</h3>
                <p>各种项目的说明文档和部署指南</p>
                <a href="/legacy/docs" target="_blank">查看文档</a>
            </div>
            
            <div class="content-item">
                <h3>服务器配置</h3>
                <p>服务器部署脚本和配置文件</p>
                <a href="/legacy/config" target="_blank">查看配置</a>
            </div>
        </div>
    </div>
</body>
</html>
